<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three-impostor</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				background: #2b3a4a;
				color: #fff;
				font-family: monospace;
				font-size: 13px;
			}

			#info {
				position: absolute;
				top: 10px;
				width: 100%;
				text-align: center;
				pointer-events: none;
			}
		</style>
	</head>

	<body>
		<div id="info">three-impostor<br>left: mesh (91,216 triangles), right: impostor (12 triangles)</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
					"three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
					"three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
					"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { ImpostorBaker, ImpostorNodeMaterial } from '../Impostor.js';

			const renderer = new THREE.WebGPURenderer( { antialias: true } );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( animate );
			document.body.appendChild( renderer.domElement );

			const scene = new THREE.Scene();
			scene.background = new THREE.Color( 0x2b3a4a );
			scene.add( new THREE.HemisphereLight( 0xffffff, 0x2b3a4a, 2 ) );

			const light = new THREE.DirectionalLight( 0xffffff, 3 );
			light.position.set( 1, 2, 3 );
			scene.add( light );

			const camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
			camera.position.set( 0, 1.5, 9 );

			const controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 1.2, 0 );

			const gltf = await new GLTFLoader().loadAsync( 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r186/examples/models/gltf/DragonAttenuation.glb' );

			const dragon = gltf.scene.getObjectByName( 'Dragon' );
			dragon.material = new THREE.MeshStandardNodeMaterial( { color: 0xeba310, roughness: 0.5 } );
			dragon.position.set( - 2, 0, 0 );
			scene.add( dragon );

			const impostor = await new ImpostorBaker( renderer ).bake( dragon );

			const mesh = new THREE.Mesh( impostor.geometry, new ImpostorNodeMaterial( impostor, { roughness: 0.5 } ) );
			mesh.quaternion.copy( dragon.quaternion );
			mesh.scale.copy( dragon.scale );
			mesh.position.set( 2, 0, 0 );
			scene.add( mesh );

			// the impostor's own triangles, drawn over it
			const wireframe = new THREE.LineSegments( new THREE.WireframeGeometry( impostor.geometry ), new THREE.LineBasicNodeMaterial() );
			wireframe.visible = false;
			mesh.add( wireframe );

			const params = { wireframe: false };

			new GUI().add( params, 'wireframe' ).onChange( ( value ) => {

				dragon.material.wireframe = value;
				dragon.material.needsUpdate = true;
				wireframe.visible = value;

			} );

			window.addEventListener( 'resize', onWindowResize );

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				controls.update();
				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
